name: Update README assets

on:
  schedule:
    - cron: '0 */6 * * *'   
  workflow_dispatch:         

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create assets folder
        run: mkdir -p assets

      - name: Fetch stats card
        run: curl -sL "https://github-readme-stats.vercel.app/api?username=DevModee&show_icons=true&count_private=true&theme=tokyonight&hide_border=true&bg_color=00000000" -o assets/stats.svg

      - name: Fetch top languages card
        run: curl -sL "https://github-readme-stats.vercel.app/api/top-langs/?username=DevModee&layout=compact&theme=tokyonight&hide_border=true&bg_color=00000000" -o assets/top-langs.svg

      - name: Fetch activity graph
        run: curl -sL "https://github-readme-activity-graph.vercel.app/graph?username=DevModee&theme=tokyo-night&hide_border=true&bg_color=00000000" -o assets/activity-graph.svg

      - name: Fetch trophies
        run: curl -sL "https://github-profile-trophy.vercel.app/?username=DevModee&theme=tokyonight&no-frame=true&column=7&margin-w=10" -o assets/trophies.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh README stat images"
          git push
