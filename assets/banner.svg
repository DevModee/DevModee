<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e1d1a" stroke-width="1"/>
    </pattern>
    <linearGradient id="topBar" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff451a"/>
      <stop offset="55%" stop-color="#ff7a45"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glow1" cx="85%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#ff451a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0b0b0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0b0b0a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base canvas -->
  <rect width="1200" height="260" rx="12" fill="#0b0b0a"/>
  <rect width="1200" height="260" rx="12" fill="url(#grid)"/>
  <rect width="1200" height="260" rx="12" fill="url(#glow1)"/>
  <rect width="1200" height="260" rx="12" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="11.5" stroke="#272623"/>

  <!-- Top accent hairline -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#topBar)"/>

  <!-- Left column: Status pill -->
  <g transform="translate(56, 44)">
    <rect width="232" height="28" rx="4" fill="#141412" stroke="#272623"/>
    <circle cx="16" cy="14" r="4" fill="#10b981"/>
    <text x="30" y="18" fill="#dad7cf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="0.06em">AVAILABLE · ARGENTINA</text>
  </g>

  <!-- Main Display Name -->
  <text x="56" y="132" fill="#f3f1ec" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="-0.03em">Mat&#237;as S&#225;nchez Gonz&#225;lez<tspan fill="#ff451a">.</tspan></text>

  <!-- Tagline -->
  <text x="56" y="170" fill="#aba89f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400">Full-Stack Developer  &#183;  Building products &amp; open-source tools</text>

  <!-- Bottom tags -->
  <g transform="translate(56, 198)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <rect width="136" height="28" rx="4" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.45"/>
    <text x="14" y="18" fill="#34d399">pellemarket.com</text>

    <g transform="translate(148, 0)">
      <rect width="174" height="28" rx="4" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.40"/>
      <text x="14" y="18" fill="#7dd3fc">npx mercadopago-mcp</text>
    </g>

    <g transform="translate(334, 0)">
      <rect width="116" height="28" rx="4" fill="#ff451a" fill-opacity="0.12" stroke="#ff451a" stroke-opacity="0.45"/>
      <text x="14" y="18" fill="#ff6b47">aerosdev.com</text>
    </g>

    <g transform="translate(462, 0)">
      <rect width="118" height="28" rx="4" fill="#191916" stroke="#272623"/>
      <text x="14" y="18" fill="#dad7cf">matiasgs.com</text>
    </g>
  </g>

  <!-- Right architectural status card -->
  <g transform="translate(848, 44)">
    <rect width="296" height="172" rx="8" fill="#121210" stroke="#272623"/>
    <rect x="0" y="0" width="296" height="30" rx="8" fill="#181815"/>
    <line x1="0" y1="30" x2="296" y2="30" stroke="#272623"/>
    <circle cx="16" cy="15" r="4" fill="#ff451a"/>
    <circle cx="30" cy="15" r="4" fill="#d97757"/>
    <circle cx="44" cy="15" r="4" fill="#10b981"/>
    <text x="64" y="19" fill="#8a877e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">devmodee.status</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
      <text x="18" y="58" fill="#8a877e">flagship</text>
      <text x="108" y="58" fill="#34d399">PelleMarket v2.2</text>

      <text x="18" y="84" fill="#8a877e">open src</text>
      <text x="108" y="84" fill="#7dd3fc">mercadopago-mcp (npm)</text>

      <text x="18" y="110" fill="#8a877e">systems</text>
      <text x="108" y="110" fill="#ff6b47">Atom · Covalos · Aeros</text>

      <text x="18" y="136" fill="#8a877e">verified</text>
      <text x="108" y="136" fill="#d97757">HackerRank (5) · Claude</text>

      <text x="18" y="158" fill="#8a877e">mcp</text>
      <text x="108" y="158" fill="#34d399">Glama A · HOL Guard</text>
    </g>
  </g>
</svg>
